# Upload zdjec produktow (multipart) — domyslne limity Springa (1MB/10MB) sa za male
# na zdjecia z telefonu. Request i tak nie przekroczy 100MB — tyle ucina Cloudflare
# Tunnel; wieksze produkty klient wgrywa partiami (POST /api/products/{id}/images).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
